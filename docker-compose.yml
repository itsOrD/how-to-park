services:
  app:
    build: .
    ports:
      - "${PORT:-1111}:1111"
    environment:
      - PORT=1111
      - MONGODB_URI=mongodb://mongo:27017/howtopark
      - ALLOWED_ORIGINS=http://localhost:1111
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
